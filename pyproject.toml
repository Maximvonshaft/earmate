[project]
name = "earmate"
version = "0.1.0"
description = "Visual rule-driven web scraping framework core components"
authors = [
  { name = "Earmate Contributors" }
]
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
