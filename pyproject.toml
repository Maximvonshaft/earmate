[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earmate"
version = "0.1.0"
description = "Programmable data collection platform with visual recording, backend execution, and scheduling"
authors = [{name = "Earmate"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26", "pytest-asyncio>=0.21", "ruff>=0.2"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["backend/tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
